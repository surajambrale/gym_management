<div class="auth-container">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-logo">SS</div>
      <h2>SS FITNESS</h2>
      <span>MANAGER PRO</span>
    </div>
    <header class="auth-heading">
      <h1>Forgot Password?</h1>
      <p>Enter your registered email and we’ll send a secure reset link if an account matches.</p>
    </header>

    <div class="error-message" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>
    <div class="success-message" *ngIf="successMessage" role="status">{{ successMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="reset-email">Registered Email Address</label>
        <input id="reset-email" type="email" formControlName="email" autocomplete="email"
          placeholder="Enter your registered email">
        <small *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Enter a valid email address.
        </small>
      </div>
      <button type="submit" class="login-btn" [disabled]="loading">
        {{ loading ? 'Sending reset link…' : 'Send Reset Link' }}
      </button>
    </form>

    <div class="auth-footer"><a routerLink="/login">← Back to Login</a></div>
    <div class="copyright">© 2026 SS Builds365. All rights reserved.</div>
  </main>
</div>
