<section class="subscription-page">
  <span class="eyebrow">ACCOUNT SUBSCRIPTION</span>
  <h2>Subscription</h2>
  <p *ngIf="loading">Loading current subscription status…</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <article class="subscription-card" *ngIf="!loading && !errorMessage">
    <span>Current status</span>
    <strong>{{ status }}</strong>
    <p>No subscription catalog, price or checkout provider is configured for this account. No plan or payment action is available here.</p>
  </article>
</section>
